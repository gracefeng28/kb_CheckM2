<!DOCTYPE html>
<html>
<head>
<style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background-color: #f9fbfd;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-radius: 0px;
            overflow: hidden;
        }

        th {
            background-color: #6389F2;
            color: white;
            font-weight: 600;
            text-align: left;
            padding: 14px 16px;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #E1E8ED;
            color: #444444;
        }

        tr:nth-child(even) {
            background-color: #F8FAFC;
        }

        tr:hover {
            background-color: #F0F4F8;
            cursor: pointer;
        }

</style>
</head>
<body>

<h3>Results summary:</h3>

{table}

</script>
     
</body>
</html>
